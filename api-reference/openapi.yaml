openapi: 3.1.0

info:
  title: Tikk API
  version: '1.0.0'
  summary: Your Tikk profile, services, free time slots and bookings.
  description: |
    A REST API over one Tikk account: its public profile, its services, the
    time slots it has free and the bookings people have made with it. Reading
    is the default; writing is limited to services.

    Every response is JSON, every timestamp is ISO 8601 in UTC, and every
    request needs a bearer token: an API key (`tikk_sk_...`) or an OAuth access
    token. Each endpoint requires one scope. Rate limit: 60 requests per minute
    per credential.
  contact:
    name: Tikk support
    url: https://tikk.chat

servers:
  - url: https://app.tikk.chat/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Profile
    description: Your public profile and plan.
  - name: Services
    description: Your default services and single-use links.
  - name: Availability
    description: The time slots you have free.
  - name: Bookings
    description: The bookings people have made with you.

paths:
  /profile:
    get:
      operationId: getProfile
      summary: Get your profile
      description: |
        Returns your public profile and plan. Services have their own endpoint,
        [`GET /services`](/api-reference/services/list-services).

        **Scope:** `profile.read`
      tags: [Profile]
      security:
        - bearerAuth: [profile.read]
      responses:
        '200':
          description: Your profile.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingScope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /services:
    get:
      operationId: listServices
      summary: List your services
      description: |
        Lists your services of one type, paginated. Without `type` you get your
        default services: the ones visitors can book right now, which means
        active and within your plan's service limit, with the `is_default` one
        first. Single-use services are listed newest first, whatever their
        status.

        **Scope:** `services.read`
      tags: [Services]
      security:
        - bearerAuth: [services.read]
      parameters:
        - name: type
          in: query
          required: false
          description: Which type of service to list.
          schema:
            type: string
            enum: [default, single_use]
            default: default
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of services.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCollection'
              examples:
                default:
                  summary: Default services
                  value:
                    data:
                      - type: default
                        id: 48213
                        slug: intro-call
                        title: Intro call
                        description: A first chat to see if we're a fit.
                        is_default: true
                        is_group: false
                        max_attendees: null
                        requires_approval: true
                        durations:
                          - minutes: 30
                            price: null
                            currency: EUR
                          - minutes: 60
                            price: 7500
                            currency: EUR
                        location:
                          type: video
                          label: Video Meeting
                          address: null
                        embed_url: https://tikk.chat/jane/intro-call
                    links:
                      first: https://app.tikk.chat/api/v1/services?page=1
                      last: https://app.tikk.chat/api/v1/services?page=1
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      from: 1
                      last_page: 1
                      links: []
                      path: https://app.tikk.chat/api/v1/services
                      per_page: 25
                      to: 1
                      total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingScope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      operationId: createService
      summary: Create a service
      description: |
        Creates a service and returns it. `type` decides which fields apply:

        - `default` creates a permanent booking page. It takes the same fields
          the API returns for one, and counts toward the Free plan's service
          limit.
        - `single_use` creates a private booking link for one person. Copy one
          of your default services with `service`, or send a `title` for a
          standalone link. Send the person the returned `url`.

        Booking limits, custom hours, `is_active` and the highlighted service
        aren't writable through the API. Set those in Tikk.

        **Scope:** `services.write`
      tags: [Services]
      security:
        - bearerAuth: [services.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateDefaultService'
                - $ref: '#/components/schemas/CreateSingleUseService'
              discriminator:
                propertyName: type
                mapping:
                  default: '#/components/schemas/CreateDefaultService'
                  single_use: '#/components/schemas/CreateSingleUseService'
            examples:
              default:
                summary: Default service
                value:
                  type: default
                  title: Intro call
                  durations:
                    - minutes: 30
                      price: null
                    - minutes: 60
                      price: 7500
                  location:
                    type: video
              singleUseCopy:
                summary: Single-use, copied from a default service
                value:
                  type: single_use
                  service: 48213
                  contact_name: Sam Smith
                  contact_email: sam@example.com
              singleUseStandalone:
                summary: Single-use, standalone
                value:
                  type: single_use
                  title: Follow-up with Sam
                  duration: 45
                  expires_in_days: 14
      responses:
        '201':
          description: The created service.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnvelope'
              examples:
                default:
                  $ref: '#/components/examples/DefaultService'
                singleUse:
                  $ref: '#/components/examples/SingleUseService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The credential lacks `services.write`, or creating a default service
            would go over the Free plan's service limit (`plan_required`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MissingScopeError'
                  - $ref: '#/components/schemas/PlanRequiredError'
              examples:
                missingScope:
                  $ref: '#/components/examples/MissingScope'
                planRequired:
                  summary: Plan limit reached
                  value:
                    message: Upgrade to Pro to create more than 1 service.
                    error: plan_required
                    required_plan: pro
                    upgrade_url: https://app.tikk.chat/billing
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The service `id`, as returned by `GET /services` or `POST /services`. Slugs aren't accepted.
        schema:
          type: integer
        example: 48213

    get:
      operationId: getService
      summary: Get a service
      description: |
        Returns one service of either type. Fields that don't apply to a type
        are left out rather than set to `null`. A default service that isn't
        bookable right now returns `404`.

        **Scope:** `services.read`
      tags: [Services]
      security:
        - bearerAuth: [services.read]
      responses:
        '200':
          description: The service.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnvelope'
              examples:
                default:
                  $ref: '#/components/examples/DefaultService'
                singleUse:
                  $ref: '#/components/examples/SingleUseService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    patch:
      operationId: updateService
      summary: Edit a default service
      description: |
        Changes the fields you send on a default service and returns it. Fields
        you leave out keep their value. `durations` and `location` are
        replaced as a whole when sent.

        A single-use service can't be edited: delete it and create a new one.

        **Scope:** `services.write`
      tags: [Services]
      security:
        - bearerAuth: [services.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultServiceFields'
            example:
              title: Discovery call
              durations:
                - minutes: 45
                  price: 5000
      responses:
        '200':
          description: The updated service.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DefaultService'
                required: [data]
              examples:
                default:
                  $ref: '#/components/examples/DefaultService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The service is single-use, and single-use services can't be edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: A single-use service cannot be edited. Delete it and create a new one.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      operationId: deleteService
      summary: Delete a service
      description: |
        Deletes a service of either type.

        - A default service is deleted. If it was the highlighted one, your
          oldest remaining service becomes highlighted.
        - A single-use service is deleted only while it hasn't been booked. A
          booked one stays: it's the booking's record of how it was made.

        **Scope:** `services.write`
      tags: [Services]
      security:
        - bearerAuth: [services.write]
      responses:
        '204':
          description: Deleted. The body is empty.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The single-use service has been booked and can't be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: A single-use service that has been booked cannot be deleted.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /availability:
    get:
      operationId: listAvailability
      summary: List your free time slots
      description: |
        Returns the slots you're bookable in, grouped by day, exactly as a
        visitor sees them on your booking page: your weekly availability, date
        overrides, buffers and synced calendars are all taken into account.

        Days without a free slot are left out, so an empty `data` object means
        nothing is bookable in the range.

        **Scope:** `availability.read`
      tags: [Availability]
      security:
        - bearerAuth: [availability.read]
      parameters:
        - name: service
          in: query
          required: false
          description: |
            A service `id`, of either type. Narrows the answer to that service's
            own availability, durations and buffers. Omit for your general
            availability. An id that isn't one of your services returns `404`.
          schema:
            type: integer
            minimum: 1
          example: 48213
        - name: from
          in: query
          required: false
          description: First day of the range, `YYYY-MM-DD`. Defaults to today. Past days never return slots.
          schema:
            type: string
            format: date
          example: '2026-08-17'
        - name: to
          in: query
          required: false
          description: |
            Last day of the range, `YYYY-MM-DD`. Defaults to 7 days after
            `from`. The range is capped at 31 days: a later `to` is clamped
            without an error, and `meta.to` reports the day actually answered.
          schema:
            type: string
            format: date
          example: '2026-08-24'
        - name: duration
          in: query
          required: false
          description: |
            Slot length in minutes. Defaults to the service's shortest duration,
            or 30 without a service.
          schema:
            type: integer
            minimum: 15
            maximum: 180
          example: 30
      responses:
        '200':
          description: Free slots for each day in the range that has any.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MissingScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bookings:
    get:
      operationId: listBookings
      summary: List your bookings
      description: |
        Returns your bookings, newest first, paginated. Every record is the
        full booking. All filters are optional and combine:
        `?status=accepted&from=2026-08-17&order=asc` walks your upcoming
        confirmed schedule forwards.

        **Scope:** `bookings.read` · **Plan:** Pro. A Free account gets `403`
        with `plan_required`.
      tags: [Bookings]
      security:
        - bearerAuth: [bookings.read]
      parameters:
        - name: status
          in: query
          required: false
          description: Only bookings in this state.
          schema:
            type: string
            enum: [pending, accepted, declined, cancelled]
        - name: from
          in: query
          required: false
          description: Only bookings scheduled at or after this date or date-time.
          schema:
            type: string
            format: date-time
          example: '2026-08-17T00:00:00+00:00'
        - name: to
          in: query
          required: false
          description: Only bookings scheduled at or before this date or date-time. Can't be before `from`.
          schema:
            type: string
            format: date-time
          example: '2026-09-17T00:00:00+00:00'
        - name: order
          in: query
          required: false
          description: Sort direction on `scheduled_at`.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of bookings.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProScopeForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bookings/{id}:
    get:
      operationId: getBooking
      summary: Get a booking
      description: |
        Returns one booking, the same full object as in the list.

        **Scope:** `bookings.read` · **Plan:** Pro. A Free account gets `403`
        with `plan_required`.
      tags: [Bookings]
      security:
        - bearerAuth: [bookings.read]
      parameters:
        - name: id
          in: path
          required: true
          description: The booking `id`, as returned by `GET /bookings`.
          schema:
            type: integer
          example: 1234567
      responses:
        '200':
          description: The booking.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Booking'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProScopeForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An API key from **Settings → API Keys** (starts with `tikk_sk_`), or an
        OAuth access token for a partner app. Both carry scopes; each endpoint
        lists the one it needs.

  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      description: Results per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Page:
      name: page
      in: query
      required: false
      description: Page to return.
      schema:
        type: integer
        minimum: 1
        default: 1

  headers:
    X-RateLimit-Limit:
      description: Requests allowed per minute for this credential.
      schema:
        type: integer
        example: 60
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema:
        type: integer
        example: 59

  responses:
    Unauthorized:
      description: No credential was sent, or it's revoked, expired or unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    MissingScope:
      description: The credential doesn't carry the scope this endpoint needs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MissingScopeError'
          examples:
            missingScope:
              $ref: '#/components/examples/MissingScope'
    ProScopeForbidden:
      description: |
        The credential doesn't carry `bookings.read`, or the account is on Free
        and this scope needs Pro (`plan_required`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingScopeError'
              - $ref: '#/components/schemas/PlanRequiredError'
          examples:
            missingScope:
              $ref: '#/components/examples/MissingScope'
            planRequired:
              summary: Account on Free
              value:
                message: This endpoint requires the Tikk account to be on the Pro plan.
                error: plan_required
                required_plan: pro
                upgrade_url: https://app.tikk.chat/billing
    NotFound:
      description: |
        Nothing with this id on your account. Ids that belong to another
        account also return `404`: the API never confirms they exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not found.
    ValidationFailed:
      description: One or more parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: More than 60 requests in a minute for this credential.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

  examples:
    DefaultService:
      summary: Default service
      value:
        data:
          type: default
          id: 48213
          slug: intro-call
          title: Intro call
          description: A first chat to see if we're a fit.
          is_default: true
          is_group: false
          max_attendees: null
          requires_approval: true
          durations:
            - minutes: 30
              price: null
              currency: EUR
            - minutes: 60
              price: 7500
              currency: EUR
          location:
            type: video
            label: Video Meeting
            address: null
          embed_url: https://tikk.chat/jane/intro-call
    SingleUseService:
      summary: Single-use service
      value:
        data:
          type: single_use
          id: 73920
          title: Intro call for Sam Smith
          description: null
          status: open
          url: https://tikk.chat/jane/Xk3pQ9aB2c/intro-call-for-sam-smith
          contact:
            name: Sam Smith
            email: sam@example.com
          durations:
            - minutes: 30
              price: null
              currency: EUR
          expires_at: '2026-10-31T09:00:00+00:00'
          created_at: '2026-10-01T09:00:00+00:00'
    MissingScope:
      summary: Missing scope
      value:
        message: Missing required scope.
        scopes: [services.write]

  schemas:
    Profile:
      type: object
      properties:
        username:
          type: [string, 'null']
          description: Your Tikk handle, and the `data-domain` value for the embed script. `null` until you pick one.
          example: jane
        name:
          type: [string, 'null']
          description: Display name, shown at the top of your booking page.
          example: Jane Doe
        title:
          type: [string, 'null']
          description: Job title, shown beneath your name.
          example: Coach
        bio:
          type: [string, 'null']
          example: I help founders find focus.
        avatar_url:
          type: [string, 'null']
          format: uri
          description: Profile photo.
        logo_url:
          type: [string, 'null']
          format: uri
          description: Brand logo. `null` if you haven't uploaded one.
        profile_url:
          type: [string, 'null']
          format: uri
          description: Your public booking page. `null` until you pick a username.
          example: https://tikk.chat/jane
        profile_complete:
          type: boolean
          description: '`false` until you pick a username. Bookings can''t come in until then.'
          example: true
        plan:
          type: string
          enum: [free, pro]
          description: Your plan. Pro scopes only work on `pro`, so use it to hide or badge Pro features up front.
          example: pro
      required: [username, name, title, bio, avatar_url, logo_url, profile_url, profile_complete, plan]

    Duration:
      type: object
      properties:
        minutes:
          type: integer
          description: Length in minutes.
          example: 30
        price:
          type: [integer, 'null']
          description: Price in minor currency units, so `7500` is €75.00. `null` when free. Always `null` on single-use services, which are never paid.
          example: 7500
        currency:
          type: string
          description: ISO 4217 code. Always `EUR`.
          example: EUR
      required: [minutes, price, currency]

    DefaultService:
      type: object
      description: A permanent booking page, such as "Intro call".
      properties:
        type:
          type: string
          const: default
        id:
          type: integer
          description: Pass it to `/services/{id}`, as `service` on `/availability`, and as `service` on `POST /services` to copy it into a single-use service.
          example: 48213
        slug:
          type: string
          description: The last segment of the service's booking URL.
          example: intro-call
        title:
          type: string
          example: Intro call
        description:
          type: [string, 'null']
          description: Shown on the booking page.
        is_default:
          type: boolean
          description: '`true` for the one service your booking page highlights. Not the same as `type: default`.'
        is_group:
          type: boolean
          description: '`true` if several people can book the same slot.'
        max_attendees:
          type: [integer, 'null']
          description: Seat cap for a group service. `null` otherwise.
        requires_approval:
          type: boolean
          description: '`true` if you accept each booking by hand.'
        durations:
          type: array
          description: The durations a booker can pick.
          items:
            $ref: '#/components/schemas/Duration'
        location:
          oneOf:
            - $ref: '#/components/schemas/ServiceLocation'
            - type: 'null'
          description: Where the meeting takes place.
        embed_url:
          type: [string, 'null']
          format: uri
          description: The service's booking URL. `null` until you pick a username.
          example: https://tikk.chat/jane/intro-call
      required: [type, id, slug, title, description, is_default, is_group, max_attendees, requires_approval, durations, location, embed_url]

    SingleUseService:
      type: object
      description: A private booking link for one person, spent once it's booked. Bookings made through one are accepted straight away and never paid.
      properties:
        type:
          type: string
          const: single_use
        id:
          type: integer
          description: Pass it to `GET` and `DELETE /services/{id}`, and as `service` on `/availability`.
          example: 73920
        title:
          type: string
          description: Name of the link.
          example: Intro call for Sam Smith
        description:
          type: [string, 'null']
          description: Note shown at the top of the booking page.
        status:
          type: string
          enum: [open, used, expired, disabled]
          description: |
            `open` can be booked. `used` has been booked and no longer works.
            `expired` passed `expires_at` without a booking. `disabled` was
            switched off in Tikk. A used link stays `used`, even after it
            expires or is switched off.
          example: open
        url:
          type: [string, 'null']
          format: uri
          description: The private link to send. `null` until you pick a username.
          example: https://tikk.chat/jane/Xk3pQ9aB2c/intro-call-for-sam-smith
        contact:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
          description: Who the link is for. `null` when no contact was given.
        durations:
          type: array
          description: The offered durations.
          items:
            $ref: '#/components/schemas/Duration'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the link stops working.
        created_at:
          type: [string, 'null']
          format: date-time
      required: [type, id, title, description, status, url, contact, durations, expires_at, created_at]

    Service:
      oneOf:
        - $ref: '#/components/schemas/DefaultService'
        - $ref: '#/components/schemas/SingleUseService'
      discriminator:
        propertyName: type
        mapping:
          default: '#/components/schemas/DefaultService'
          single_use: '#/components/schemas/SingleUseService'

    ServiceEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Service'
      required: [data]

    ServiceCollection:
      type: object
      properties:
        data:
          type: array
          description: Services of the requested type.
          items:
            $ref: '#/components/schemas/Service'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, links, meta]

    ServiceLocation:
      type: object
      properties:
        type:
          type: string
          enum: [video, in_person, none]
          example: video
        label:
          type: string
          description: Human-readable name of the location type.
          example: Video Meeting
        address:
          type: [string, 'null']
          description: Only when you show the address publicly. `null` otherwise.
      required: [type, label, address]

    DefaultServiceFields:
      type: object
      description: The writable fields of a default service.
      properties:
        title:
          type: string
          maxLength: 50
          example: Intro call
        description:
          type: [string, 'null']
          maxLength: 500
          description: Shown on the booking page.
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: |
            Lowercase letters, digits and single hyphens, unique among your
            services. Custom slugs need Pro: on Free the slug is generated from
            the title and a `slug` you send is ignored.
          example: intro-call
        durations:
          type: array
          minItems: 1
          description: Replaces all durations when sent.
          items:
            type: object
            properties:
              minutes:
                type: integer
                minimum: 5
                maximum: 480
                description: Length in minutes. No repeats.
                example: 30
              price:
                type: [integer, 'null']
                minimum: 0
                maximum: 999999
                description: Minor currency units, so `1500` is €15.00. `null` for free.
                example: 1500
            required: [minutes]
        is_group:
          type: boolean
          description: Several people can book the same slot. Needs Pro; `true` on Free returns `422`.
        max_attendees:
          type: [integer, 'null']
          minimum: 2
          maximum: 50
          description: Seat cap. Required when `is_group` is `true`.
        requires_approval:
          type: boolean
          description: Accept each booking by hand. Needs Pro; on Free, bookings are always accepted automatically.
        location:
          type: object
          description: Replaces the location when sent.
          properties:
            type:
              type: string
              enum: [video, in_person, none]
            address:
              type: [string, 'null']
              maxLength: 100
          required: [type]

    CreateDefaultService:
      title: Default service
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: default
          required: [type]
        - $ref: '#/components/schemas/DefaultServiceFields'
        - required: [title, durations]

    CreateSingleUseService:
      title: Single-use service
      type: object
      properties:
        type:
          type: string
          const: single_use
        service:
          type: integer
          description: |
            The `id` of one of your bookable default services to copy. The link
            offers that service's durations and location. Can't be combined
            with `duration`.
          example: 48213
        title:
          type: [string, 'null']
          maxLength: 50
          description: |
            Name of the link. Required without `service`. With `service` it
            replaces the default title, "{service} for {contact_name}".
        description:
          type: [string, 'null']
          maxLength: 500
          description: Note shown at the top of the booking page.
        contact_name:
          type: [string, 'null']
          maxLength: 100
          description: Who the link is for.
        contact_email:
          type: [string, 'null']
          format: email
          maxLength: 255
          description: When given, the contact is saved to your contacts.
        expires_in_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          default: 30
          description: Days until the link expires.
        duration:
          type: [integer, 'null']
          minimum: 5
          maximum: 480
          default: 30
          description: Meeting length in minutes. Standalone links only.
      required: [type]

    AvailabilityResponse:
      type: object
      properties:
        data:
          type: object
          description: Free slots keyed by date (`YYYY-MM-DD`). Days without a free slot are left out.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Slot'
        meta:
          $ref: '#/components/schemas/AvailabilityMeta'
      required: [data, meta]
      example:
        data:
          '2026-08-17':
            - start: '2026-08-17T08:00:00+00:00'
              end: '2026-08-17T08:30:00+00:00'
              label: '10:00'
            - start: '2026-08-17T08:30:00+00:00'
              end: '2026-08-17T09:00:00+00:00'
              label: '10:30'
          '2026-08-19':
            - start: '2026-08-19T12:00:00+00:00'
              end: '2026-08-19T12:30:00+00:00'
              label: '14:00'
        meta:
          from: '2026-08-17'
          to: '2026-08-24'
          duration_minutes: 30
          timezone: Europe/Brussels
          service: 48213

    Slot:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Start, UTC.
          example: '2026-08-17T08:00:00+00:00'
        end:
          type: string
          format: date-time
          description: End, UTC.
          example: '2026-08-17T08:30:00+00:00'
        label:
          type: string
          description: The start time in your timezone (`meta.timezone`), ready to display.
          example: '10:00'
        spots_remaining:
          type: integer
          description: Seats left. Only present for group services that show their remaining seats.
          example: 3
      required: [start, end, label]

    AvailabilityMeta:
      type: object
      properties:
        from:
          type: string
          format: date
          description: First day answered.
          example: '2026-08-17'
        to:
          type: string
          format: date
          description: Last day answered, after the 31-day cap.
          example: '2026-08-24'
        duration_minutes:
          type: integer
          description: Slot length used.
          example: 30
        timezone:
          type: string
          description: Your timezone, the one each slot's `label` is in.
          example: Europe/Brussels
        service:
          type: [integer, 'null']
          description: The service `id` the answer is for, or `null` for general availability.
          example: 48213
      required: [from, to, duration_minutes, timezone, service]

    BookingCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, links, meta]

    Booking:
      type: object
      properties:
        id:
          type: integer
          description: Pass it to `/bookings/{id}`.
          example: 1234567
        status:
          type: string
          enum: [pending, accepted, declined, cancelled]
          example: accepted
        topic:
          type: [string, 'null']
          description: What the booker said the meeting is about.
          example: Exploring a partnership
        duration_minutes:
          type: integer
          example: 30
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: When the meeting starts. `null` while it isn't scheduled yet.
          example: '2026-08-19T12:00:00+00:00'
        created_at:
          type: [string, 'null']
          format: date-time
          example: '2026-08-10T09:14:00+00:00'
        notes:
          type: [string, 'null']
          example: Bring the Q3 roadmap.
        cancellation_reason:
          type: [string, 'null']
          description: Set when the booking was declined or cancelled.
        booker:
          $ref: '#/components/schemas/Person'
        attendees:
          type: array
          description: Further people on a group booking. Empty for one-to-one meetings.
          items:
            $ref: '#/components/schemas/Person'
        service:
          oneOf:
            - $ref: '#/components/schemas/BookingService'
            - type: 'null'
          description: The service that was booked.
        location:
          $ref: '#/components/schemas/BookingLocation'
        meeting_link:
          type: [string, 'null']
          format: uri
          description: Checkout link for a paid meeting while payment is outstanding. `null` otherwise.
        conference_link:
          type: [string, 'null']
          format: uri
          description: Video call link, when the meeting has one.
          example: https://meet.google.com/abc-defg-hij
        payment:
          $ref: '#/components/schemas/Payment'
      required: [id, status, topic, duration_minutes, scheduled_at, created_at, notes, cancellation_reason, booker, attendees, service, location, meeting_link, conference_link, payment]

    BookingService:
      type: object
      properties:
        type:
          type: string
          enum: [default, single_use]
        id:
          type: integer
          description: The `id` `/services/{id}` takes.
          example: 48213
        slug:
          type: [string, 'null']
          description: '`null` for single-use services.'
          example: intro-call
        title:
          type: string
          example: Intro call
        is_group:
          type: boolean
        max_attendees:
          type: [integer, 'null']
      required: [type, id, slug, title, is_group, max_attendees]

    BookingLocation:
      type: object
      properties:
        type:
          type: [string, 'null']
          enum: [video, in_person, none, null]
          example: video
        label:
          type: [string, 'null']
          example: Video Meeting
        address:
          type: [string, 'null']
          description: Address, for meetings that have one.
      required: [type, label, address]

    Person:
      type: object
      properties:
        name:
          type: [string, 'null']
          example: Sam Smith
        email:
          type: [string, 'null']
          format: email
          example: sam@example.com
      required: [name, email]

    Payment:
      type: object
      properties:
        status:
          type: string
          enum: [none, pending, paid, failed, refunded]
          description: '`none` is a free meeting.'
          example: paid
        amount:
          type: [integer, 'null']
          description: Minor currency units, so `5000` is €50.00.
          example: 5000
        currency:
          type: string
          example: EUR
      required: [status, amount, currency]

    PaginationLinks:
      type: object
      properties:
        first:
          type: [string, 'null']
          format: uri
        last:
          type: [string, 'null']
          format: uri
        prev:
          type: [string, 'null']
          format: uri
          description: '`null` on the first page.'
        next:
          type: [string, 'null']
          format: uri
          description: '`null` on the last page.'
      required: [first, last, prev, next]

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: [integer, 'null']
          description: Position of the first result on this page.
          example: 1
        last_page:
          type: integer
          example: 4
        links:
          type: array
          description: Numbered pager links, for building a page-number UI.
          items:
            type: object
            properties:
              url:
                type: [string, 'null']
                format: uri
              label:
                type: string
              active:
                type: boolean
        path:
          type: string
          format: uri
          description: The endpoint URL without query parameters.
        per_page:
          type: integer
          example: 25
        to:
          type: [integer, 'null']
          description: Position of the last result on this page.
          example: 25
        total:
          type: integer
          description: Results across all pages.
          example: 87
      required: [current_page, from, last_page, links, path, per_page, to, total]

    Error:
      type: object
      properties:
        message:
          type: string
          description: What went wrong. Branch on the status code, not on this text.
      required: [message]

    MissingScopeError:
      type: object
      properties:
        message:
          type: string
          example: Missing required scope.
        scopes:
          type: array
          description: The scope or scopes the endpoint needs.
          items:
            type: string
      required: [message, scopes]

    PlanRequiredError:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
          const: plan_required
        required_plan:
          type: string
          const: pro
        upgrade_url:
          type: string
          format: uri
          description: Where the account owner can upgrade.
      required: [message, error, required_plan, upgrade_url]

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The to field must be a date after or equal to from.
        errors:
          type: object
          description: Failed rules, keyed by parameter name.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            to:
              - The to field must be a date after or equal to from.
      required: [message, errors]
